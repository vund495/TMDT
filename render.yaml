# Render Blueprint — tạo môi trường production chỉ với 1 lần bấm "New + => Blueprint"
# DB dùng Supabase (Postgres free 500MB), không tạo Postgres ở Render.
# Sau khi tạo, bổ sung các biến sync:false ngay trên dashboard trước khi service start.
#
# Lưu ý:
#  - Vite bake API_BASE_URL vào lúc BUILD => nếu đổi tên service / URL, phải thay
#    VITE_API_BASE_URL rồi redeploy.
#  - UPLOADS_DIR nên trỏ vào Disk mount (Render plan >= Starter) để ảnh upload
#    không biến mất khi redeploy. Với plan free, file sẽ mất theo instance.

services:
  - type: web
    name: tmdt-backend
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      # Dán connection string của Supabase (Pooler, thẻ Transaction, port 6543).
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: require
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOADS_DIR
        value: uploads
      - key: BANK_BIN
        value: 970418
      - key: ACCOUNT_NO
        value: 96247P8RAY
      - key: ACCOUNT_NAME
        value: NGUYEN DUY VU
      - key: SEPAY_WEBHOOK_SECRET
        sync: false
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_RETURN_URL
        sync: false

# Frontend không tạo qua Blueprint (Render chưa hỗ trợ "static" trong Blueprint).
# Tạo thủ công: Render => New + => Static Site => chọn repo =>
#   Build Command : npm ci && npm run build
#   Publish Dir   : dist
#   Env           : VITE_API_BASE_URL = https://<backend>.onrender.com