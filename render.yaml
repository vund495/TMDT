# Render Blueprint — tạo môi trường production chỉ với 1 lần bấm "New + => Blueprint"
# Sau khi tạo, bổ sung các biến sync:false ngay trên dashboard trước khi service start.
#
# Lưu ý:
#  - Vite bake API_BASE_URL vào lúc BUILD => nếu đổi tên service / URL, phải thay
#    VITE_API_BASE_URL rồi redeploy.
#  - UPLOADS_DIR nên trỏ vào Disk mount (Render plan >= Starter) để ảnh upload
#    không biến mất khi redeploy. Với plan free, file sẽ mất theo instance.

databases:
  - name: tmdt-db
    plan: free
    databaseName: tmdt
    user: tmdt

services:
  - type: web
    name: tmdt-backend
    runtime: docker
    region: singapore
    plan: free
    healthCheckPath: /health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tmdt-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "false"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOADS_DIR
        value: uploads
      - key: BANK_BIN
        value: 970418
      - key: ACCOUNT_NO
        value: 96247P8RAY
      - key: ACCOUNT_NAME
        value: NGUYEN DUY VU
      - key: SEPAY_WEBHOOK_SECRET
        sync: false
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_RETURN_URL
        sync: false

  - type: static
    name: tmdt-frontend
    region: singapore
    buildCommand: npm ci && npm run build
    publishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_API_BASE_URL
        sync: false