name: PR Preview

# Tìm URL preview mà Render tạo cho PR (service preview của vietcraft-frontend)
# rồi comment link + trạng thái vào PR. Render đã tự tạo GitHub Deployment cho PR,
# workflow này chỉ gom link về một chỗ cho dễ bấm.
#
# Điều kiện: Render Dashboard → vietcraft-frontend → tab "Previews" →
#   Pull Request Previews = Automatic  (hoặc Manual + label "render-preview")
# Static site free => PR preview cũng free.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  deployments: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  comment-preview:
    name: Link preview lên PR
    runs-on: ubuntu-latest
    # Fork PR không có quyền comment bằng GITHUB_TOKEN (cần pull_request_target).
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Tìm URL preview của Render (chờ tối đa ~10 phút)
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          url=""
          for i in $(seq 1 40); do
            ids=$(gh api "repos/$REPO/deployments?sha=$SHA&per_page=30" --jq '.[].id' 2>/dev/null || true)
            for id in $ids; do
              found=$(gh api "repos/$REPO/deployments/$id/statuses" \
                --jq '[.[] | select(.environment_url != null)][0].environment_url' 2>/dev/null || true)
              if [ -n "$found" ] && [ "$found" != "null" ]; then
                url="$found"
                break
              fi
            done
            if [ -n "$url" ]; then
              echo "Tìm thấy preview: $url"
              break
            fi
            echo "lần $i: chưa có preview, chờ 15s..."
            sleep 15
          done
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Chờ preview trả HTTP 200
        id: check
        if: steps.find.outputs.url != ''
        env:
          URL: ${{ steps.find.outputs.url }}
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo 000)
            echo "lần $i: $URL → $code"
            if [ "$code" = "200" ]; then
              echo "status=ok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "status=slow" >> "$GITHUB_OUTPUT"

      - name: Comment / cập nhật comment trên PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          URL: ${{ steps.find.outputs.url }}
          STATE: ${{ steps.check.outputs.status }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MARK='<!-- vietcraft-preview -->'
          if [ -z "$URL" ]; then
            BODY="$MARK
          ### 🔍 Preview PR

          Chưa tìm thấy preview environment cho commit \`${SHA:0:7}\`.

          - Kiểm tra Render → **vietcraft-frontend** → tab **Previews**: đã bật *Pull Request Previews* chưa?
          - Nếu để chế độ **Manual**: thêm label **render-preview** (hoặc sửa tiêu đề PR thành \`[render preview] ...\`) rồi push lại.
          - Build preview (static) thường mất 1–3 phút, workflow này chờ tối đa ~10 phút.

          > Backend không có preview riêng (Blueprint preview environments cần workspace Pro). PR preview dùng API production."
          else
            if [ "$STATE" = "ok" ]; then
              BADGE="✅ Preview đang chạy (HTTP 200)"
            else
              BADGE="⚠️ Có preview nhưng chưa trả 200 (đang build / cold start)"
            fi
            BODY="$MARK
          ### 🔍 Preview PR

          **UI:** $URL

          $BADGE

          - Preview dùng \`VITE_API_BASE_URL\` của service gốc → gọi **API production**, dữ liệu là dữ liệu thật.
          - Preview tự xoá khi PR merge/close.
          - Backend thay đổi nhiều thì chạy local: \`docker compose up -d --build\` (xem README)."
          fi

          cid=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$MARK\")) | .id" | head -n 1)
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$cid" -f body="$BODY" > /dev/null
            echo "Đã cập nhật comment $cid"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" > /dev/null
            echo "Đã tạo comment mới"
          fi
