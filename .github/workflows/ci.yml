name: CI

# Chạy trên mọi push vào main và mọi pull request.
# CD (deploy Render) nằm ở .github/workflows/deploy.yml và chỉ chạy khi CI xanh trên main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  # Vite bake biến này vào bundle lúc BUILD (không đọc lúc runtime).
  VITE_API_BASE_URL: https://vietcraft-backend.onrender.com

jobs:
  backend:
    name: Backend · pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cài dependencies
        run: pip install -r requirements.txt

      - name: Chạy test
        env:
          SECRET_KEY: ci-only-secret
          DATABASE_URL: ""
        run: pytest -q

  migrations:
    name: Backend · Alembic upgrade (Postgres 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tmdt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tmdt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/tmdt
      DB_SSL: ""
      SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Cài dependencies
        run: pip install -r requirements.txt

      - name: Chạy toàn bộ migration trên DB trống
        run: alembic upgrade head

      - name: Xác nhận DB đang ở head
        run: |
          alembic current
          alembic current | grep -q "(head)"

  frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cài dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build production
        run: npm run build

      - name: Lưu bundle build được (dùng để debug trên Actions)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker · build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (không push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: vietcraft-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
