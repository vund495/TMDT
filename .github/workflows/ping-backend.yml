name: ping-backend

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping VietCraft backend (giữ instance khỏi ngủ)
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 90 https://vietcraft-backend.onrender.com/health || echo "fail")
          echo "health status: $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Backend health khong phai 200 ($code)"
          fi