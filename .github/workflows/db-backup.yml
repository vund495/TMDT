name: db-backup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  pg-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database (postgres:17 tar)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          mkdir -p dump
          docker run --rm \
            -e DATABASE_URL \
            -v "$PWD/dump:/out" \
            postgres:17 \
            pg_dump "$DATABASE_URL" -Fc -f "/out/backup-$(date +%Y%m%d-%H%M%S).dump"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: dump/
          retention-days: 30