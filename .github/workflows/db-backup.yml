name: db-backup

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  pg-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          mkdir -p dump
          pg_dump "$DATABASE_URL" -Fc -f "dump/backup-$(date +%Y%m%d-%H%M%S).dump"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup
          path: dump/
          retention-days: 30